# Spring profile used by the test suite (DwaraApplicationTests) and by the
# Docker test workflow (scripts/docker-test.sh).
#
# The only committed credential-like value is TEST_JWT_SECRET below. It is
# explicitly test-scope: production reads JWT_SECRET from the environment with
# no default (see src/main/resources/application.yaml). The Docker workflow
# overrides every value with freshly generated ones per run.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/dwara_test}
spring.datasource.username=${TEST_DB_USER:dwara_user}
spring.datasource.password=${TEST_DB_PASSWORD:dwara_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Base64 of a 39-byte test-only string. Test-only, never deployed.
jwt.secret=${TEST_JWT_SECRET:ZHdhcmEtdGVzdC1vbmx5LWp3dC1zaWduaW5nLWtleS0zMmJ5dGVz}
jwt.expiration=${TEST_JWT_EXPIRATION:3600000}

dwara.admin-key=${TEST_ADMIN_KEY:test-admin-key}
# Keep the suite deterministic: tests create the fixtures they need.
dwara.seed-demo-facility=false
