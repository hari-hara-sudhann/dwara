spring:
  application:
    name: dwara

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: ${SPRING_JPA_OPEN_IN_VIEW:false}
    properties:
      hibernate:
        show-sql: true

server:
  port: ${APP_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

dwara:
  sessions:
    # Spec D20: a CREATED session the user never validated at a gate is aborted
    # after this long.
    stale-after: ${STALE_SESSION_AFTER:PT15M}
    # Spec §10 #5: how long after exit an already-EXITED session may re-open.
    # Mirrors the firmware's GATE_OPEN_HOLD_MS servo close timer.
    exit-grace-window: ${EXIT_GRACE_WINDOW:PT8S}
    # How often the stale-session sweep runs.
    stale-sweep-interval: ${STALE_SWEEP_INTERVAL:PT1M}
